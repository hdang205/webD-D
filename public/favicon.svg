<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Gold/Silver Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Inner Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Fashion Hanger / Crown Icon Motif -->
  <g transform="translate(256, 170) scale(1.6)" filter="url(#glow)">
    <!-- Hanger Hook -->
    <path d="M 0 -22 C -8 -22, -10 -12, -2 -6 C 2 -3, 0 4, 0 8" fill="none" stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Hanger Body -->
    <path d="M -32 20 L 0 8 L 32 20 C 35 21, 35 24, 32 25 L -32 25 C -35 24, -35 21, -32 20 Z" fill="url(#ringGrad)" opacity="0.9" />
  </g>

  <!-- Central D&D Text Monogram -->
  <text x="256" y="325" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="108" 
        font-weight="900" 
        letter-spacing="-2"
        fill="url(#accentGrad)" 
        text-anchor="middle"
        filter="url(#glow)">D&amp;D</text>

  <!-- Subtitle Ribbon -->
  <text x="256" y="375" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="10" 
        fill="#a5b4fc" 
        text-anchor="middle"
        opacity="0.95">FASHION</text>

  <!-- Small Sparkle Accents -->
  <circle cx="130" cy="150" r="4" fill="#f472b6" />
  <circle cx="382" cy="150" r="4" fill="#818cf8" />
  <circle cx="110" cy="350" r="3" fill="#c084fc" />
  <circle cx="402" cy="350" r="3" fill="#818cf8" />
</svg>
